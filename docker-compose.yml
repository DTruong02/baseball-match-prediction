services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: baseball
      POSTGRES_PASSWORD: baseball
      POSTGRES_DB: baseball
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U baseball -d baseball"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
