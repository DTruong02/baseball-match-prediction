# Auto-merged for local `docker compose up` (not used when COMPOSE_FILE lists files explicitly).
# Publishes app ports on the host for development.
services:
  db:
    ports:
      - "5432:5432"

  redis:
    ports:
      - "6379:6379"

  api:
    ports:
      - "8000:8000"

  web:
    ports:
      - "3000:3000"
