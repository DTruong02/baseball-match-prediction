[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "baseball-analyze"
version = "0.1.0"
description = "Pregame MLB home win probability from MLB Stats API + FanGraphs (pybaseball)"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "httpx>=0.27",
    "numpy>=1.24",
    "pandas>=2.0",
    "pybaseball>=2.2",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "scikit-learn>=1.3",
    "typer>=0.12",
    "joblib>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
chat = ["openai>=1.0"]
backend = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]

[project.scripts]
baseball-analyze = "baseball_analyze.cli:main"
baseball-analyze-train = "baseball_analyze.train:main_train"
baseball-api = "baseball_backend.main:main"

[tool.setuptools.packages.find]
where = ["src", "backend"]
