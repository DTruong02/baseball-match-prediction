# Default logistic regression training config for baseball-analyze-train.
# CLI flags override any value here, e.g.:
#   baseball-analyze-train --config configs/logistic_regression.yaml --max-games 400

seasons: [2022, 2023]
val_seasons: []
max_games: null
test_size: 0.25
out: artifacts/model.joblib
log_csv: artifacts/training_log.csv
random_state: 42
cache_dir: null

hyperparameters:
  calibrate: false
  class_weight: balanced
  c_grid: [0.05, 0.1, 0.5, 1.0, 5.0, 10.0]
